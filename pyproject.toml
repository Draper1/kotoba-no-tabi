[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kotoba-no-tabi"
version = "0.1.0"
description = "言葉の旅 — a terminal adventure for learning Japanese to JLPT N5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rich"]
keywords = ["japanese", "jlpt", "n5", "spaced-repetition", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.scripts]
kotoba = "kotoba.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kotoba"]

[tool.hatch.build.targets.sdist]
include = ["kotoba", "tests.py", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__"]
